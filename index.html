<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Report</title>
        <link href="https://fonts.googleapis.com/css2?family=Special+Gothic+Expanded+One&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca&display=swap" rel="stylesheet">
		<link rel="stylesheet" href="./dist/style.css" />

         <!-- STANDARD JS -->
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/all/global.js"></script>

        <!-- THEME JS -->
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/monarch/global.js"></script>

        <!-- STYLESHEETS -->
        <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/skeleton.css' rel='stylesheet' />
        <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/monarch/theme.css' rel='stylesheet' />
        <link href='https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/monarch/palettes/purple.css' rel='stylesheet' />

        <link rel="icon" href="src/asset/logo/documents.png" type="image/x-icon">
	</head>
	<body>
        <div class="flex min-h-screen">
            <aside id="sidebar-container"class="bg-[#353A3E] h-auto w-auto pt-6 pr-4 pl-4 pb-4">
                <div class="flex space-x-5">
                    <button id="toggle-sidebar" class="cursor-pointer" onclick="toggleSideBar()">
                            <img src="src/asset/logo/sidebar.png" class="max-h-6 max-w-8 place-self-left" >
                    </button>
                <h1 id="today-date" class="navbar-font text-md text-white"></h1>
                </div>
                <div class="pt-5">
                    <button id="" class="cursor-pointer flex space-x-5" onclick="dashboard()">
                        <img src="src/asset/logo/home.png" class="max-w-10 h-auto place-self-left" alt="">
                        <h1 id="aside-home" class="navbar-font text-white justify-center text-left mt-2">Dashboard</h1>
                    </button>
                </div>
                <div id="" class="flex space-x-5 pt-5">
                    <button class="cursor-pointer flex space-x-5" onclick="" id="">                    
                        <img src="src/asset/logo/shift.png" alt="" class="max-w-10 place-self-left">
                        <h1 id="aside-shift-text" class="navbar-font text-white justify-center text-left mt-2">Shift</h1>
                    </button>
                    <select id="aside-shift" name="Shift" class="cursor-pointer border-1 border-white p-2 text-white">
                        <option value="pagi" class="text-black">Pagi</option>
                        <option value="siang" class="text-black">Siang</option>
                        <option value="malam" class="text-black">Malam</option>
                    </select>
                </div>

                <!-- calender -->
                <div class="flex space-x-5 pt-5">
                    <img src="src/asset/logo/calendar.png" alt="" class="h-auto max-w-8 place-self-left">
                    <h1 id="aside-calendar" class="navbar-font text-white pt-2 text-lg">Calendar</h1>
                </div>
                <div id="calendar-wrapper" class="pt-2" >
                    <div id="navbar-content-calendar" class="">
                        <script>
                            let calendar;

                            document.addEventListener("DOMContentLoaded", function () {
                            const calendarEl = document.getElementById("navbar-content-calendar");
                            calendar = new FullCalendar.Calendar(calendarEl, {
                                initialView: "dayGridMonth",
                                height: 315,
                                headerToolbar: {
                                    left: "prev",
                                    center: "title",
                                    right: "next"
                                },
                                footerToolbar: {
                                    left: "prevYear",
                                    center: "today",
                                    right: "nextYear"
                                },
                                titleFormat: {
                                    year: "numeric",
                                    month: "short"
                                }
                            });
                            calendar.render();
                            const dateNow = document.getElementById('today-date');
                            const autoFillDate = document.getElementById('auto-fill-date')
                            const dateFormatting = calendar.getDate()
                                dateNow.textContent ="Today : "+ dateFormatting.toLocaleDateString('id-ID', 
                                    {weekday: 'short',day: "numeric", month: 'short', year: 'numeric' })
                                autoFillDate.value = dateFormatting.toLocaleDateString('id-ID', 
                                    {weekday: 'short',day: "numeric", month: 'short', year: 'numeric' })
                                });
                        </script>
                    </div>
                </div>
                <div class="pt-5">
                    <button id="" class="cursor-pointer" onclick="daftarPegawai()">
                        <div class="flex space-x-5">
                            <img src="src/asset/logo/pegawai.png" alt="" class="max-w-10 h-auto place-self-left">
                            <h1 id="aside-pegawai" class="navbar-font text-white justify-center text-left mt-2">Daftar Pegawai</h1>
                        </div>
                    </button>
                </div>
                <div class="pt-5">
                    <button id="" class="cursor-pointer" onclick="daftarPasien()">
                        <div class="flex space-x-5">
                            <img src="src/asset/logo/pasien.png" alt="" class="max-w-10 h-auto place-self-left">
                            <h1 id="aside-pasien" class="navbar-font text-white justify-center text-left mt-2">Daftar Pasien</h1>
                        </div>
                    </button>
                </div>    
            </aside>

            <main class="min-w-0 flex-1" id="">
                <div class="grid grid-cols-3 p-4">
                    <button id="" onclick="addNewReport()" class="cursor-pointer bg-[#353A3E] rounded-xl place-self-start w-auto hover:bg-black transition duration-200">
                        <div class="justify-center place-self-center p-2">
                            <h2 class="text-white text-xl text-center">Add Data +</h2>
                        </div>
                    </button>

                    <h1 id="report-title-dashboard" class="navbar-font text-2xl text-center place-self-center">SBAR Shift's Report</h1>
                    <h1 id="report-title-pegawai" class="navbar-font text-2xl text-center hidden place-self-center">Daftar Pegawai</h1>
                    <h1 id="report-title-pasien" class="navbar-font text-2xl text-center hidden place-self-center">Daftar Pasien</h1>

                    <form id="searchForm" class="flex space-x-2 top-0 place-self-end">
                        <input id="aside-search" type="text" class="border border-1 rounded-xl p-2" placeholder="Cari Nama" value="">
                        <button id="searchName" class="cursor-pointer" type="submit">
                            <img src="src/asset/logo/search.png" class="h-auto max-w-8 invert" alt="">
                        </button>
                    </form>
                </div>
                <div id="table-header-dashboard" class="bg-[#BFBFBF] p-4 grid grid-cols-8 gap-4 w-full">
                    <h2 class="">No</h2>
                    <h2 class="">Name</h2>
                    <h2 class="">Shift</h2>
                    <h2 class="">Situation</h2>
                    <h2 class="">Background</h2>
                    <h2 class="">Assessment</h2>
                    <h2 class="">Recommendation</h2>
                    <h2 class=""></h2>
                </div>
                <div id="table-data-pasien-sabr" class="">
                </div>

                <div id="daftar-pegawai" class="hidden">
                    <div id="table-header-pegawai" class="bg-[#BFBFBF] p-4 grid grid-cols-4 gap-4 w-full">
                        <h2 class="">No</h2>
                        <h2 class="">Name</h2>
                        <h2 class="">Kode</h2>
                        <h2 class=""></h2>
                    </div>
                    <div id="table-data-daftar-pegawai" class="">
                    </div>
                </div>

                <div id="daftar-pasien" class="hidden">
                    <div id="table-header-pasien" class="bg-[#BFBFBF] p-4 grid grid-cols-4 gap-4 w-full">
                        <h2 class="">No</h2>
                        <h2 class="">Name</h2>
                        <h2 class="">Age</h2>
                        <h2 class=""></h2>
                    </div>
                    <div id="table-data-daftar-pasien" class="">
                    </div>
                </div>
            </main>
        </div>

        <div id="modal-add-data" class="overflow-y-scroll fixed w-full h-full bg-black/50 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 hidden">
            <div id="modal-content" class="bg-white w-1/2 h-auto rounded-xl p-4 justify-center place-self-center">
                <button id="close-modal" class="cursor-pointer place-self-end" onclick="document.getElementById('modal-add-data').classList.add('hidden')">
                    <img src="src/asset/logo/delete.png" alt="" class="max-w-5 h-auto">
                </button>
                <h1 class="text-center text-2xl">Add Data</h1>
                <div id="modal-form-name-shift" class="grid grid-cols-2 gap-4 pt-4">
                    <div id="modal-form-name" class="flex flex-col space-y-4">
                        <h2 class="text-left">Name</h2>
                        <input type="text" name="" id="" class="border border-1 rounded-xl p-2 w-full" placeholder="Name">
                    </div>
                    <div id="modal-form-shift" class="flex flex-col space-y-4">
                        <h2 class="text-left">Shift</h2>
                        <select id="modal-shift-selector" name="Shift" class="cursor-pointer border-1 p-2">
                            <option value="pagi" class="text-black">Pagi</option>
                            <option value="siang" class="text-black">Siang</option>
                            <option value="malam" class="text-black">Malam</option>
                        </select>
                    </div>
                </div>
                <div id="modal-form-date" class="flex flex-col space-y-4 pt-4">
                    <h2 class="text-left">Date</h2>
                    <input type="text" name="" id="auto-fill-date" class="border border-1 rounded-xl p-2 w-full" placeholder="Date">
                </div>
                <div id="modal-form-situation" class="flex flex-col space-y-4 pt-4">
                    <h2 class="text-left">Situation</h2>
                    <input type="text" name="" id="" class="border border-1 rounded-xl p-2 w-full" placeholder="Situation">
                </div>
                <div id="modal-form-background" class="flex flex-col space-y-4 pt-4">
                    <h2 class="text-left">Background</h2>
                    <input type="text" name="" id="" class="border border-1 rounded-xl p-2 w-full" placeholder="Background  ">
                </div>
                <div id="modal-form-assessment" class="flex flex-col space-y-4 pt-4">
                    <h2 class="text-left">Assessment</h2>
                    <input type="text" name="" id="" class="border border-1 rounded-xl p-2 w-full" placeholder="Assessment">
                </div>
                <div id="modal-form-recommendation" class="flex flex-col space-y-4 pt-4">
                    <h2 class="text-left">Recommendation</h2>
                    <input type="text" name="" id="" class="border border-1 rounded-xl p-2 w-full" placeholder="Recommendation">
                </div>
                <div id="modal-form-submit" class="pt-4 place-self-end">
                    <button id="" class="cursor-pointer bg-[#353A3E] rounded-xl  w-auto hover:bg-black transition duration-200">
                        <div class="justify-center place-self-center p-2">
                            <h2 class="text-white text-center">Submit</h2>
                        </div>
                    </button>
                </div>  
            </div>
        </div>
	</body>
    <script>
        // alert("Aplikasi Masih dalam Pengembangan, untuk segala kendala silahkan dilaporkan, diperhatikan juga untuk aplikasi tidak sampai ke ke tangan lain")
        function toggleSideBar(){
            document.getElementById('sidebar-container').classList.toggle('pr-4')
            document.getElementById('aside-home').classList.toggle('hidden')
            document.getElementById('today-date').classList.toggle('hidden')
            document.getElementById('aside-calendar').classList.toggle('hidden')
            document.getElementById('calendar-wrapper').classList.toggle('hidden')
            document.getElementById('aside-shift').classList.toggle('hidden')
            document.getElementById('aside-shift-text').classList.toggle('hidden')
            document.getElementById('aside-pegawai').classList.toggle('hidden')
            document.getElementById('aside-pasien').classList.toggle('hidden')
            document.getElementById('prevMonth').classList.toggle('hidden')
            document.getElementById('nextMonth').classList.toggle('hidden')
        }
        async function fetchDataPasien() {
            const resDaftarPasien = await fetch('http://localhost:3000/api/pasien')
            const data_pasien = await resDaftarPasien.json()
            return data_pasien
        }
        async function fetchDataPegawai() {
            const resDaftarPasien = await fetch('http://localhost:3000/api/pegawai')
            const data_pegawai = await resDaftarPasien.json()
            return data_pegawai
        }
        async function fetchDataSabr() {
            const resDaftarSabr = await fetch('http://localhost:3000/api/sabr_report')
            const data_sabr = await resDaftarSabr.json()
            return data_sabr
        }

        async function dashboard(){
            document.getElementById('daftar-pegawai').classList.add('hidden')
            document.getElementById('table-data-daftar-pegawai').classList.add('hidden')
            document.getElementById('report-title-pegawai').classList.add('hidden')
            document.getElementById('table-header-pegawai').classList.add('hidden')

            document.getElementById('table-data-pasien-sabr').classList.remove('hidden')
            document.getElementById('report-title-dashboard').classList.remove('hidden')
            document.getElementById('table-header-dashboard').classList.remove('hidden')
        
            document.getElementById('daftar-pasien').classList.add('hidden')
            document.getElementById('report-title-pasien').classList.add('hidden')
            document.getElementById('table-header-pasien').classList.add('hidden')
            document.getElementById('table-data-daftar-pasien').classList.add('hidden')    
            
            let data_sabr = await fetchDataSabr()
            let data_pasien = await fetchDataPasien()
            const nama_pasien = data_sabr.map((nama_pasien) => {
                const eachName = data_pasien.find((pasien) => pasien.id_pasien === nama_pasien.pasien_id)
                return eachName
            })

            const shiftSelect = document.getElementById('aside-shift')
            const selectedShift = shiftSelect.value
            shiftSelect.addEventListener("change", dashboard);

            const target = document.getElementById('table-data-pasien-sabr')
            if (selectedShift) {
                const filteredData = data_sabr.filter((sabr) => sabr.shift === selectedShift)
                const date = document.getElementById('auto-fill-date').value
                const filteredDataByDate = filteredData.filter((sabr) => sabr.date === date)
                target.innerHTML = filteredData.map((sabr) => `
                    <div id="data-sabr-wrapper" class="pt-1 pb-1">
                        <div id="" class="bg-white p-4 grid grid-cols-8 gap-4 w-full">
                            <h2 class="">${sabr.id_report}</h2>
                            <h2 id="nama-pasien" class=""></h2>
                            <h2 class="">${sabr.shift}</h2>
                            <h2 class="">${sabr.situation}</h2>
                            <h2 class="">${sabr.background}</h2>
                            <h2 class="">${sabr.assessment}</h2>
                            <h2 class="">${sabr.recommendation}</h2>
                            <div id="action" class="flex space-x-4 justify-center place-self-start">
                                <button class="max-w-5 h-auto cursor-pointer" id="" onclick="">
                                    <img src="src/asset/logo/edit.png" alt="" class="">
                                </button>
                                <button class="max-w-5 h-auto cursor-pointer" id="" onclick="">
                                    <img src="src/asset/logo/delete.png" alt="" class="">
                                </button>
                            </div>
                        </div>
                    </div>    
                `).join('') 

            const namaPasienElements = document.querySelectorAll('#nama-pasien')
            namaPasienElements.forEach((element, index) => {
                element.textContent = nama_pasien[index].nama
            })
        }else{
            const date = document.getElementById('auto-fill-date').value
            console.log(`Shift yang dipilih : ${selectedShift} dan tanggal : ${date}`)
            target.innerHTML = '<h1 class="text-center text-gray-500">Tidak ada data pada shift ' + selectedShift + ' dan tanggal ' + date + '</h1>'
        }
    }


        dashboard()
        
        async function daftarPegawai(){
            document.getElementById('table-data-pasien-sabr').classList.add('hidden')
            document.getElementById('report-title-dashboard').classList.add('hidden')
            document.getElementById('table-header-dashboard').classList.add('hidden')

            document.getElementById('daftar-pegawai').classList.remove('hidden')
            document.getElementById('table-data-daftar-pegawai').classList.remove('hidden')
            document.getElementById('report-title-pegawai').classList.remove('hidden')
            document.getElementById('table-header-pegawai').classList.remove('hidden')

            document.getElementById('daftar-pasien').classList.add('hidden')
            document.getElementById('report-title-pasien').classList.add('hidden')
            document.getElementById('table-header-pasien').classList.add('hidden')
            document.getElementById('table-data-daftar-pasien').classList.add('hidden')

            let data_pegawai = await fetchDataPegawai()
            const target = document.getElementById('table-data-daftar-pegawai')
            target.innerHTML = data_pegawai.map((pegawai) => `
                    <div id="data-pegawai-wrapper" class="pt-1 pb-1">
                        <div id="" class="bg-white p-4 grid grid-cols-4 gap-4 w-full">
                            <h2 class="">${pegawai.id_pegawai}</h2>
                            <h2 class="">${pegawai.nama}</h2>
                            <h2 class="">${pegawai.kode}</h2>
                            <div id="action" class="flex space-x-4 justify-center place-self-end">
                                <button class="max-w-5 h-auto cursor-pointer" id="" onclick="">
                                    <img src="src/asset/logo/edit.png" alt="" class="">
                                </button>
                                <button class="max-w-5 h-auto cursor-pointer" id="" onclick="">
                                    <img src="src/asset/logo/delete.png" alt="" class="">
                                </button>
                            </div>
                        </div>
                    </div>    
            `).join('')
        }
        async function daftarPasien(){
            document.getElementById('daftar-pegawai').classList.add('hidden')
            document.getElementById('table-data-daftar-pegawai').classList.add('hidden')
            document.getElementById('report-title-pegawai').classList.add('hidden')
            document.getElementById('table-header-pegawai').classList.add('hidden')

            document.getElementById('table-data-pasien-sabr').classList.add('hidden')
            document.getElementById('report-title-dashboard').classList.add('hidden')
            document.getElementById('table-header-dashboard').classList.add('hidden')
            
            document.getElementById('daftar-pasien').classList.remove('hidden')
            document.getElementById('report-title-pasien').classList.remove('hidden')
            document.getElementById('table-header-pasien').classList.remove('hidden')
            document.getElementById('table-data-daftar-pasien').classList.remove('hidden')

            let data_pasien = await fetchDataPasien()
            const target = document.getElementById('table-data-daftar-pasien')
            target.innerHTML = data_pasien.map((pasien) => `
                    <div id="data-pasien-wrapper" class="pt-1 pb-1">
                        <div id="" class="bg-white p-4 grid grid-cols-4 gap-4 w-full">
                            <h2 class="">${pasien.id_pasien}</h2>
                            <h2 class="">${pasien.nama}</h2>
                            <h2 class="">${pasien.umur}</h2>
                            <div id="action" class="flex space-x-4 justify-center place-self-end">
                                <button class="max-w-5 h-auto cursor-pointer" id="" onclick="">
                                    <img src="src/asset/logo/edit.png" alt="" class="">
                                </button>
                                <button class="max-w-5 h-auto cursor-pointer" id="" onclick="">
                                    <img src="src/asset/logo/delete.png" alt="" class="">
                                </button>
                            </div>
                        </div>
                    </div>    
            `).join('')

        }
        
        let currentKeyword ="";

        function searchName(){
            const searching = document.getElementById('searchForm');
            const inputText = document.getElementById('aside-search');

            function startSearching(text){
                text.preventDefault();
                currentKeyword = inputText.value.trim()
                readKey(currentKeyword)

            }
            const returnValue = searching.addEventListener('submit',startSearching)
        }
        searchName()

        function readKey(keyword){
            console.log(`Filter yang apply : ${keyword}`)
        }

        function addNewReport(){
            document.getElementById('modal-add-data').classList.remove('hidden')
        }
        </script>
</html>
